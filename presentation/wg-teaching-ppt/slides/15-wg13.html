<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html { background: #F7FBFF; }
    body {
      width: 720pt;
      height: 405pt;
      margin: 0;
      padding: 0;
      display: flex;
      background: #F7FBFF;
      color: #17324D;
      font-family: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    .slide {
      width: 720pt;
      height: 405pt;
      padding: 26pt 30pt;
      display: flex;
      flex-direction: column;
      gap: 12pt;
    }
    .eyebrow {
      margin: 0;
      color: #1D7F8E;
      font-size: 10.5pt;
      font-weight: bold;
      letter-spacing: 1.1pt;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 26pt;
      line-height: 1.2;
      color: #153B6B;
    }
    h2 {
      margin: 0;
      font-size: 22pt;
      line-height: 1.25;
      color: #153B6B;
    }
    h3 {
      margin: 0;
      font-size: 15pt;
      line-height: 1.25;
      color: #153B6B;
    }
    .subtitle {
      margin: 0;
      color: #3E5E7A;
      font-size: 12.5pt;
      line-height: 1.5;
    }
    .muted {
      margin: 0;
      color: #52708A;
      font-size: 11pt;
      line-height: 1.4;
    }
    .two-col {
      display: flex;
      gap: 18pt;
      flex: 1;
      align-items: stretch;
      min-height: 0;
    }
    .left {
      width: 47%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }
    .right {
      width: 53%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    ul {
      margin: 0;
      padding-left: 18pt;
      color: #17324D;
      font-size: 13pt;
      line-height: 1.45;
    }
    li { margin: 0 0 8pt 0; }
    .cover {
      display: flex;
      gap: 22pt;
      flex: 1;
      align-items: center;
    }
    .cover-copy {
      width: 45%;
      display: flex;
      flex-direction: column;
      gap: 12pt;
    }
    .cover-copy h1 { font-size: 30pt; }
    .cover-visual {
      width: 55%;
      height: 300pt;
      background: #EAF5FF;
      border-radius: 24pt;
      padding: 10pt;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cards-7 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10pt;
      margin-top: 6pt;
    }
    .cards-7 .card:nth-child(n+5) {
      grid-column: span 1;
    }
    .card {
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 18pt;
      padding: 12pt;
      min-height: 86pt;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card p {
      margin: 0;
      font-size: 11pt;
      line-height: 1.35;
    }
    .num {
      width: 24pt;
      height: 24pt;
      border-radius: 12pt;
      background: #1FC8A5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .num p {
      margin: 0;
      color: #FFFFFF;
      font-size: 11pt;
      font-weight: bold;
    }
    .panel {
      width: 100%;
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 18pt;
      padding: 14pt;
    }
    .flow {
      display: flex;
      gap: 10pt;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      width: 100%;
    }
    .box {
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 16pt;
      padding: 10pt 12pt;
      width: 120pt;
      min-height: 70pt;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box.teal { background: #EAF8F5; border-color: #8EE0D0; }
    .box.blue { background: #EAF2FF; border-color: #A8CCF5; }
    .box.navy { background: #163B6A; border-color: #163B6A; }
    .box p {
      margin: 0;
      text-align: center;
      font-size: 11pt;
      line-height: 1.35;
      color: #17324D;
    }
    .box.navy p { color: #FFFFFF; }
    .arrow {
      width: 24pt;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arrow p {
      margin: 0;
      font-size: 18pt;
      color: #1FC8A5;
      font-weight: bold;
    }
    .compare {
      display: flex;
      gap: 14pt;
      flex: 1;
    }
    .compare-col {
      width: 50%;
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 18pt;
      padding: 14pt;
      display: flex;
      flex-direction: column;
      gap: 10pt;
    }
    .compare-col ul { font-size: 12pt; }
    .pill-row {
      display: flex;
      gap: 8pt;
      flex-wrap: wrap;
    }
    .pill {
      background: #EAF5FF;
      border-radius: 999pt;
      padding: 8pt 12pt;
      border: 1.5pt solid #C9DFF7;
    }
    .pill p {
      margin: 0;
      font-size: 11pt;
      color: #153B6B;
      font-weight: bold;
    }
    .three {
      display: flex;
      gap: 12pt;
      flex: 1;
    }
    .three .col {
      width: 33.33%;
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 18pt;
      padding: 14pt;
      display: flex;
      flex-direction: column;
      gap: 8pt;
    }
    .three .col ul { font-size: 11.5pt; padding-left: 16pt; }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 10pt;
      width: 100%;
    }
    .stack .layer {
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 16pt;
      padding: 10pt 12pt;
    }
    .stack .layer.system { background: #EAF8F5; border-color: #8EE0D0; }
    .stack .layer.history { background: #EAF2FF; border-color: #A8CCF5; }
    .stack .layer.human { background: #FFF4E0; border-color: #FFD27A; }
    .stack .layer p {
      margin: 0;
      font-size: 11pt;
      line-height: 1.35;
      text-align: center;
    }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10pt;
      width: 100%;
    }
    .bubble {
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 16pt;
      padding: 10pt 12pt;
      width: 86%;
    }
    .bubble.user { align-self: flex-start; }
    .bubble.ai { align-self: flex-end; background: #EAF8F5; border-color: #8EE0D0; }
    .bubble p {
      margin: 0;
      font-size: 11pt;
      line-height: 1.35;
    }
    .file {
      width: 100%;
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 18pt;
      padding: 14pt;
    }
    .line {
      background: #EAF5FF;
      border-radius: 8pt;
      padding: 8pt 10pt;
      margin-bottom: 8pt;
    }
    .line.meta { background: #EAF8F5; }
    .line.tool { background: #FFF4E0; }
    .line p {
      margin: 0;
      font-size: 10.5pt;
      line-height: 1.3;
    }
    .meter {
      width: 100%;
      background: #DCEAF8;
      border-radius: 999pt;
      height: 22pt;
      overflow: hidden;
    }
    .meter-fill {
      height: 22pt;
      width: 72%;
      background: #1FC8A5;
    }
    .meter-fill.warn { width: 94%; background: #FFB84D; }
    .ability-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12pt;
      flex: 1;
    }
    .ability {
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 18pt;
      padding: 14pt;
    }
    .ability p { margin: 0; font-size: 12pt; line-height: 1.4; }
    .footer-note {
      margin-top: auto;
      font-size: 10.5pt;
      color: #5D7891;
    }
    .visual-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10pt;
    }
    .visual-card {
      background: #FFFFFF;
      border: 2pt solid #D5E7F7;
      border-radius: 18pt;
      padding: 12pt;
    }
    .visual-card.teal { background: #EAF8F5; border-color: #8EE0D0; }
    .visual-card.blue { background: #EAF2FF; border-color: #A8CCF5; }
    .visual-card.navy { background: #173C6C; border-color: #173C6C; }
    .visual-card p { margin: 0; font-size: 11pt; line-height: 1.35; }
    .visual-card.navy p { color: #FFFFFF; }
    .hero-shell {
      width: 100%;
      height: 100%;
      display: flex;
      gap: 12pt;
      align-items: center;
    }
    .hero-shell .screen {
      width: 58%;
      height: 210pt;
      background: #173C6C;
      border-radius: 20pt;
      padding: 16pt;
      display: flex;
      flex-direction: column;
      gap: 10pt;
    }
    .hero-shell .screen p { margin: 0; color: #FFFFFF; }
    .hero-shell .screen .visual-card p { color: #17324D; }
    .hero-shell .screen .visual-card.navy p { color: #FFFFFF; }
    .hero-shell .screen .bar {
      height: 12pt;
      border-radius: 6pt;
      background: #1FC8A5;
      width: 62%;
    }
    .hero-shell .screen .bar.small {
      width: 42%;
      background: #9EC9F6;
    }
    .hero-shell .avatar {
      width: 42%;
      height: 210pt;
      background: #FFFFFF;
      border-radius: 20pt;
      border: 2pt solid #D5E7F7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12pt;
    }
    .hero-shell .face {
      width: 84pt;
      height: 84pt;
      border-radius: 42pt;
      background: #1FC8A5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-shell .face p { margin: 0; color: #FFFFFF; font-size: 28pt; font-weight: bold; }
    .hero-shell .avatar .bar {
      height: 12pt;
      border-radius: 6pt;
      background: #173C6C;
      width: 70%;
    }
    .hero-shell .avatar .bar.small {
      width: 50%;
      background: #8DBEF3;
    }
  </style>
</head>
<body>
  <div class="slide">
    <p class="eyebrow">WG-13</p>
    <div class="two-col">
      <div class="left">
        <h2>模型不只會想，還會用工具</h2>
        <p class="subtitle">需要計算或查資料時，模型可以自己決定要不要呼叫工具。</p>
        <ul><li>`@tool` 是把 Python 函式包成可被模型呼叫的工具。</li><li>`bind_tools()` 讓模型知道有哪些工具可以用。</li><li>`tool_calls` 和 `ToolMessage` 讓『叫工具 -> 拿結果 -> 繼續回答』串起來。</li></ul>
